name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'NOTICE'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: 构建与测试 (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 检查编译环境
        shell: pwsh
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path $csc)) { throw "找不到 csc.exe：$csc" }
          Write-Host "csc        : $csc"
          Write-Host "PowerShell : $($PSVersionTable.PSVersion)"
          Write-Host "runner OS  : $([Environment]::OSVersion.VersionString)"

      - name: 构建
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./build.ps1

      - name: 自动化测试
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./test.ps1

      - name: 汇总产物
        shell: pwsh
        run: |
          $exe = 'bin/PCLRegionBypass.exe'
          if (-not (Test-Path $exe)) { throw "缺少构建产物 $exe" }

          $item = Get-Item $exe
          $info = $item.VersionInfo
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash

          Write-Host ("文件   : {0}" -f $exe)
          Write-Host ("大小   : {0:N0} 字节" -f $item.Length)
          Write-Host ("版本   : {0}" -f $info.FileVersion)
          Write-Host ("SHA256 : {0}" -f $hash)

          $lines = @(
            '### 构建产物',
            '',
            '| 项目 | 值 |',
            '| --- | --- |',
            '| 文件 | `PCLRegionBypass.exe` |',
            ('| 大小 | {0:N0} 字节 |' -f $item.Length),
            ('| 版本 | {0} |' -f $info.FileVersion),
            ('| SHA256 | `{0}` |' -f $hash)
          )
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: PCLRegionBypass-x64
          if-no-files-found: error
          retention-days: 30
          path: |
            bin/PCLRegionBypass.exe
            README.md
            DISCLAIMER.md
            LICENSE
            NOTICE
